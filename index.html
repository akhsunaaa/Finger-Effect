<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixel Portal</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <!-- Main Container -->
    <div class="app">
        <!-- Camera Viewport -->
        <div class="viewport">
            <video id="webcam" autoplay playsinline muted></video>
            <canvas id="canvas"></canvas>
            
            <!-- Status Overlay -->
            <div class="status-overlay">
                <div class="status-item">
                    <span class="status-label">FPS</span>
                    <span id="fps" class="status-value">0</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Hands</span>
                    <span id="hands-status" class="status-value">0</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Gesture</span>
                    <span id="gesture-status" class="status-value">✋</span>
                </div>
            </div>

            <!-- Recording Indicator -->
            <div id="recording-indicator" class="recording-indicator hidden">
                <span class="recording-dot"></span>
                RECORDING
            </div>
        </div>

        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h1>🎨 Filters</h1>
                <p class="subtitle">Gesture: ✊ Fist to change</p>
            </div>

            <div class="filter-list" id="filter-list">
                <button class="filter-btn active" data-filter="none" data-icon="👁️">
                    <span class="filter-icon">👁️</span>
                    <span class="filter-name">Normal</span>
                </button>
                <button class="filter-btn" data-filter="grayscale" data-icon="⚪">
                    <span class="filter-icon">⚪</span>
                    <span class="filter-name">Grayscale</span>
                </button>
                <button class="filter-btn" data-filter="sepia" data-icon="🟫">
                    <span class="filter-icon">🟫</span>
                    <span class="filter-name">Sepia</span>
                </button>
                <button class="filter-btn" data-filter="invert" data-icon="🔄">
                    <span class="filter-icon">🔄</span>
                    <span class="filter-name">Invert</span>
                </button>
                <button class="filter-btn" data-filter="pixelate" data-icon="📺">
                    <span class="filter-icon">📺</span>
                    <span class="filter-name">Pixelate</span>
                </button>
                <button class="filter-btn" data-filter="glitch" data-icon="📡">
                    <span class="filter-icon">📡</span>
                    <span class="filter-name">Glitch</span>
                </button>
                <button class="filter-btn" data-filter="thermal" data-icon="🔥">
                    <span class="filter-icon">🔥</span>
                    <span class="filter-name">Thermal</span>
                </button>
                <button class="filter-btn" data-filter="vignette" data-icon="🎭">
                    <span class="filter-icon">🎭</span>
                    <span class="filter-name">Vignette</span>
                </button>
                <button class="filter-btn" data-filter="comic" data-icon="💥">
                    <span class="filter-icon">💥</span>
                    <span class="filter-name">Comic</span>
                </button>
                <button class="filter-btn" data-filter="grid" data-icon="📐">
                    <span class="filter-icon">📐</span>
                    <span class="filter-name">Grid</span>
                </button>
                <button class="filter-btn" data-filter="duotone" data-icon="🎨">
                    <span class="filter-icon">🎨</span>
                    <span class="filter-name">Duotone</span>
                </button>
                <button class="filter-btn" data-filter="glass" data-icon="🪟">
                    <span class="filter-icon">🪟</span>
                    <span class="filter-name">Glass</span>
                </button>
                <button class="filter-btn" data-filter="neon" data-icon="💡">
                    <span class="filter-icon">💡</span>
                    <span class="filter-name">Neon</span>
                </button>
            </div>

            <div class="sidebar-footer">
                <button id="record-btn" class="record-btn">
                    <span class="record-icon">⏺️</span>
                    <span id="record-text">Record</span>
                </button>
                <button id="download-btn" class="download-btn hidden">
                    <span class="download-icon">⬇️</span>
                    Download
                </button>
                <div class="gesture-hint">
                    ✊ = Next Filter &nbsp;|&nbsp; ✌️ = Toggle Record
                </div>
            </div>
        </div>
    </div>

    <!-- Load MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous">
    </script>

    <!-- Your Main Script -->
    <script src="script.js"></script>
</body>
</html>
