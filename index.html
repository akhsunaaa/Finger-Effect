<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finger Frame Effects</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="container">
        <!-- Webcam video (hidden behind canvas) -->
        <video id="webcam" autoplay playsinline muted></video>
        
        <!-- Canvas where all the magic happens -->
        <canvas id="canvas"></canvas>
        
        <!-- Filter Controls -->
        <div class="controls">
            <button class="filter-btn active" data-filter="none">Normal</button>
            <button class="filter-btn" data-filter="grayscale">Grayscale</button>
            <button class="filter-btn" data-filter="sepia">Sepia</button>
            <button class="filter-btn" data-filter="invert">Invert</button>
            <button class="filter-btn" data-filter="pixelate">Pixelate</button>
            <button class="filter-btn" data-filter="glitch">Glitch</button>
            <button class="filter-btn" data-filter="thermal">Thermal</button>
            <button class="filter-btn" data-filter="vignette">Vignette</button>
        </div>
        
        <!-- Status Display -->
        <div class="status">
            <span id="fps">FPS: 0</span>
            <span id="hands-status">Hands: 0 detected</span>
        </div>
    </div>
    
    <!-- Load MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous">
    </script>
    
    <!-- Your Main Script -->
    <script src="script.js"></script>
</body>
</html>
